<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="js/i18n.js"></script>
<title>Tüm Ürünler · UNDO</title>
<meta name="description" content="Hakiki deri ceket ve palto koleksiyonu. Kadın ve erkek için el yapımı deri giyim.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0c0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop" data-nav="Tüm Ürünler">
<div id="site-header"></div>

<div class="wrap">
  <nav class="breadcrumb">
    <a href="index.html">Ana Sayfa</a><span class="sep">/</span>
    <span class="current" id="shop-crumb">Tüm Ürünler</span>
  </nav>

  <div class="shop-head">
    <h1 id="shop-title">Tüm Ürünler</h1>
    <p>Hakiki deriden, ustalıkla üretilmiş zamansız parçalar.</p>
  </div>

  <div class="shop-layout">
    <!-- FILTERS -->
    <aside class="filters">
      <button class="close-filters icon-btn" style="color:var(--text)" onclick="toggleFilters(false)">✕</button>
      <div class="filter-block">
        <h4>Kategori</h4>
        <div id="filter-cats"></div>
      </div>
      <div class="filter-block">
        <h4>Ürün Türü</h4>
        <div id="filter-kinds"></div>
      </div>
      <div class="filter-block">
        <h4>Beden</h4>
        <div class="size-opts" id="filter-sizes"></div>
      </div>
      <div class="filter-block">
        <h4>Renk</h4>
        <div class="color-opts" id="filter-colors"></div>
      </div>
      <div class="filter-block">
        <h4>Malzeme</h4>
        <div id="filter-materials"></div>
      </div>
      <div class="filter-block">
        <h4>Fiyat</h4>
        <input type="range" min="6000" max="25000" step="500" value="25000" style="width:100%;accent-color:var(--tan)" oninput="setMaxPrice(this.value)">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-soft);margin-top:8px">
          <span id="price-min"></span><span id="price-val"></span>
        </div>
      </div>
    </aside>

    <!-- GRID -->
    <div>
      <div class="shop-toolbar">
        <button class="filter-toggle-mobile" onclick="toggleFilters(true)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg> Filtrele
        </button>
        <span class="result-count" id="result-count"></span>
        <div class="sort-wrap">
          <span class="muted">Sırala</span>
          <select id="sort-select">
            <option value="pop">Popüler</option>
            <option value="new">Yeni</option>
            <option value="price-asc">Fiyat: Artan</option>
            <option value="price-desc">Fiyat: Azalan</option>
            <option value="rating">Puan</option>
          </select>
        </div>
      </div>
      <div class="product-grid" id="shop-grid"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
